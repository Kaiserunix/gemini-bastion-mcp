name: Feature Request
description: Suggest an improvement, integration, or documentation update for GeminiBastionMCP
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What capability or improvement would you like to see?
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation & Use Case
      description: Explain how this helps Web Gemini / Claude / ChatGPT workflows or self-hosted operations.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - 10-Tool Contract / Sandbox
        - OAuth 2.1 / Upstream SSO
        - Admin PWA / Public Portal
        - MCP-2 Downstream Federation
        - Docker / Deployment / Docs
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Design (Optional)
      description: Note how it preserves the 10-tool surface, secret isolation, and single write gate.
