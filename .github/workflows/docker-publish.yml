name: Publish Docker Images to GHCR

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: kaiserunix/gemini-bastion-mcp
  OPS_IMAGE_NAME: kaiserunix/gemini-bastion-mcp-ops
  NODE_IMAGE: node:22.23.4-bookworm-slim

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for runtime-lite
        id: meta_lite
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=lite
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}-lite

      - name: Build and push runtime-lite
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: runtime-lite
          push: true
          tags: ${{ steps.meta_lite.outputs.tags }}
          labels: ${{ steps.meta_lite.outputs.labels }}
          build-args: |
            NODE_IMAGE=${{ env.NODE_IMAGE }}
          cache-from: type=gha,scope=lite
          cache-to: type=gha,mode=max,scope=lite

      - name: Extract metadata for runtime-full
        id: meta_full
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=full
            type=semver,pattern={{version}}-full

      - name: Build and push runtime-full
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: runtime-full
          push: true
          tags: ${{ steps.meta_full.outputs.tags }}
          labels: ${{ steps.meta_full.outputs.labels }}
          build-args: |
            NODE_IMAGE=${{ env.NODE_IMAGE }}
          cache-from: type=gha,scope=full
          cache-to: type=gha,mode=max,scope=full

      - name: Extract metadata for ops-mcp
        id: meta_ops
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OPS_IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - name: Build and push ops-mcp
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.ops-mcp
          push: true
          tags: ${{ steps.meta_ops.outputs.tags }}
          labels: ${{ steps.meta_ops.outputs.labels }}
          build-args: |
            NODE_IMAGE=${{ env.NODE_IMAGE }}
          cache-from: type=gha,scope=ops
          cache-to: type=gha,mode=max,scope=ops
