# ==============================================================================
# GeminiBastionMCP (gemini-bastion-mcp) Production Docker Compose Stack
# ==============================================================================
# Usage:
#   Instant GHCR pull (lite image, ~350MB):
#     docker compose -f docker/docker-compose.yml pull && docker compose -f docker/docker-compose.yml up -d
#
#   Build full toolchain variant locally (Python 3.12+uv, mise, ruff, biome, gh, wrangler):
#     BASTION_IMAGE_TAG=full BASTION_TARGET=runtime-full docker compose -f docker/docker-compose.yml up -d --build
#
#   With authenticated ops-mcp SSH sidecar (requires OPS_MCP_AUTH_TOKEN >= 24 chars):
#     docker compose -f docker/docker-compose.yml --profile ops up -d
#
#   With dedicated UID 1002 isolated-runner sidecar (no /data, no GH/CF/OAuth secrets):
#     docker compose -f docker/docker-compose.yml --profile isolated-runner up -d
# ==============================================================================

name: gemini-bastion-mcp

services:
  gateway:
    image: ghcr.io/kaiserunix/gemini-bastion-mcp:${BASTION_IMAGE_TAG:-lite}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: ${BASTION_TARGET:-runtime-lite}
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-bookworm-slim}
    container_name: gemini-bastion-mcp-gateway
    restart: unless-stopped
    labels:
      com.geminibastion.service: "gateway"
      com.geminibastion.project: "gemini-bastion-mcp"
    env_file:
      - ../.env
    environment:
      PORT: "8787"
      DATA_DIR: /data
      ARTIFACTS_DIR: /data/artifacts
      WORKSPACES_DIR: /workspaces
      CODEX_HOME: /data/codex
      MISE_DATA_DIR: /opt/mise
      MISE_CACHE_DIR: /opt/mise/cache
      MISE_CONFIG_DIR: /opt/mise/config
      SANDBOX_UID: "1002"
      SANDBOX_GID: "1002"
      # Clear tunnel credentials from the gateway container environment
      CLOUDFLARE_TUNNEL_TOKEN: ""
      TUNNEL_TOKEN: ""
    # Internal container port ONLY — no public host port is published.
    # External ingress flows exclusively via Cloudflare Tunnel (cloudflared) or an internal reverse proxy.
    expose:
      - "8787"
    volumes:
      - mcp_sqlite_data:/data
      - mcp_workspaces:/workspaces
      - mcp_codex_sessions:/data/codex
      - mcp_tool_caches:/opt/mise
      # Uncomment when using DOWNSTREAM_MCPS_FILE=/etc/gemini-bastion/ops-mcp-config.json:
      # - ./ops-mcp-config.json:/etc/gemini-bastion/ops-mcp-config.json:ro
    networks:
      - edge_net
      - ops_net
      - runner_net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8787/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: gemini-bastion-mcp-cloudflared
    restart: unless-stopped
    labels:
      com.geminibastion.service: "cloudflared"
      com.geminibastion.project: "gemini-bastion-mcp"
    # Configure the Cloudflare Zero Trust Tunnel public hostname (e.g. mcp.example.com)
    # to route to internal service URL: http://gateway:8787
    command: tunnel --no-autoupdate run
    # Only pass TUNNEL_TOKEN (never mount ../.env so cloudflared cannot read GH_TOKEN/OAUTH_SIGNING_SECRET)
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-${TUNNEL_TOKEN:-}}
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - edge_net

  # Optional authenticated downstream MCP-2 sidecar (isolated on ops_net; zero access to /workspaces or /data)
  # Fails closed on startup unless OPS_MCP_AUTH_TOKEN (>= 24 chars) is set.
  ops-mcp:
    profiles: ["ops"]
    image: ghcr.io/kaiserunix/gemini-bastion-mcp-ops:${OPS_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile.ops-mcp
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-bookworm-slim}
    container_name: gemini-bastion-mcp-ops-sidecar
    restart: unless-stopped
    labels:
      com.geminibastion.service: "ops-mcp"
      com.geminibastion.project: "gemini-bastion-mcp"
    environment:
      OPS_MCP_AUTH_TOKEN: ${OPS_MCP_AUTH_TOKEN:-}
    expose:
      - "9000"
    volumes:
      # Dedicated restricted SSH keys/config strictly isolated from code workspaces.
      # Create ./ops-ssh (with ssh-mcp config.json and read-only deploy key) before enabling --profile ops.
      - ./ops-ssh:/etc/ops-ssh:ro
    networks:
      - ops_net
    security_opt:
      - no-new-privileges:true

  # Optional dedicated agent runner sidecar (runs strictly as UID 1002 worker with NO /data, NO SQLite, and NO GH/CF/OAuth secrets)
  isolated-runner:
    profiles: ["isolated-runner"]
    image: ghcr.io/kaiserunix/gemini-bastion-mcp:${BASTION_IMAGE_TAG:-lite}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: ${BASTION_TARGET:-runtime-lite}
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-bookworm-slim}
    container_name: gemini-bastion-mcp-isolated-runner
    restart: unless-stopped
    user: "1002:1002"
    entrypoint: ["/usr/bin/tini", "--"]
    command: ["node", "dist/runner/sidecarServer.js"]
    labels:
      com.geminibastion.service: "isolated-runner"
      com.geminibastion.project: "gemini-bastion-mcp"
    environment:
      NODE_ENV: production
      PORT: "8788"
      AGENT_RUNNER_HOST: "0.0.0.0"
      AGENT_RUNNER_PORT: "8788"
      WORKSPACES_DIR: /workspaces
      MISE_DATA_DIR: /opt/mise
      MISE_CACHE_DIR: /opt/mise/cache
      MISE_CONFIG_DIR: /opt/mise/config
      AGENT_RUNNER_AUTH_TOKEN: ${AGENT_RUNNER_AUTH_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CODEX_API_KEY: ${CODEX_API_KEY:-}
      CODEX_BASE_URL: ${CODEX_BASE_URL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DEFAULT_AGENT_DRIVER: ${DEFAULT_AGENT_DRIVER:-codex}
      SANDBOX_BWRAP_ISOLATION: ${SANDBOX_BWRAP_ISOLATION:-true}
      SANDBOX_STRICT_ISOLATION: ${SANDBOX_STRICT_ISOLATION:-false}
    expose:
      - "8788"
    volumes:
      - mcp_workspaces:/workspaces
      - mcp_tool_caches:/opt/mise
    networks:
      - runner_net
    security_opt:
      - no-new-privileges:true

networks:
  edge_net:
    driver: bridge
  ops_net:
    driver: bridge
    internal: true
  runner_net:
    driver: bridge

volumes:
  mcp_sqlite_data:
  mcp_workspaces:
  mcp_codex_sessions:
  mcp_tool_caches:
