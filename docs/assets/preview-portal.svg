<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="GeminiBastionMCP Public Gateway Portal GET / UI Preview">
  <!-- Outer Browser Frame (Warm Alabaster Editorial Theme) -->
  <rect width="1200" height="640" rx="14" fill="#FBFBFB" stroke="#E4E4E7" stroke-width="2" />
  <rect x="2" y="2" width="1196" height="42" rx="12" fill="#F4F4F5" />
  <line x1="0" y1="44" x2="1200" y2="44" stroke="#E4E4E7" stroke-width="1" />

  <!-- Minimal Window Controls & Address Bar -->
  <circle cx="24" cy="23" r="5" fill="#D4D4D8" />
  <circle cx="42" cy="23" r="5" fill="#D4D4D8" />
  <circle cx="60" cy="23" r="5" fill="#D4D4D8" />
  <rect x="350" y="9" width="500" height="26" rx="6" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1" />
  <text x="600" y="26" text-anchor="middle" fill="#52525B" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="12">https://mcp.yourdomain.com/ — Public Gateway Portal</text>
  <text x="1172" y="26" text-anchor="end" fill="#71717A" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="11">v0.3.0 · CSP Strict</text>

  <!-- Centered 720px Container (translate x=240) -->
  <g transform="translate(200, 74)" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', system-ui, sans-serif">
    <!-- Top Header Row -->
    <g transform="translate(0, 0)">
      <rect x="0" y="2" width="22" height="22" rx="5" fill="#111113" />
      <path d="M11 6 L17 9 V14 C17 17.5 14.5 20 11 21 C7.5 20 5 17.5 5 14 V9 Z" fill="none" stroke="#FAFAFA" stroke-width="1.5" />
      <text x="32" y="19" fill="#111113" font-size="16" font-weight="700" letter-spacing="-0.3">GeminiBastionMCP</text>

      <rect x="196" y="3" width="76" height="22" rx="11" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1" />
      <circle cx="210" cy="14" r="3.5" fill="#047857" />
      <text x="220" y="18" fill="#047857" font-family="'SF Mono', ui-monospace, monospace" font-size="11" font-weight="600">ONLINE</text>

      <text x="800" y="18" text-anchor="end" fill="#52525B" font-size="13" font-weight="500">Operator Console &#8594;</text>
      <line x1="0" y1="36" x2="800" y2="36" stroke="#E4E4E7" stroke-width="1" />
    </g>

    <!-- Editorial Headline -->
    <text x="0" y="76" fill="#111113" font-size="24" font-weight="700" letter-spacing="-0.6">OAuth 2.1 Streamable HTTP MCP Bastion</text>
    <text x="0" y="100" fill="#52525B" font-size="14">Self-hosted remote MCP gateway for Web Gemini, Claude.ai, and ChatGPT. 10 tools, 1 approval gate.</text>

    <!-- Card 1: Focal Endpoint Card -->
    <g transform="translate(0, 120)">
      <rect x="0" y="0" width="800" height="142" rx="10" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1.2" />
      <text x="22" y="28" fill="#71717A" font-family="'SF Mono', ui-monospace, monospace" font-size="11" font-weight="600" letter-spacing="0.6">MCP STREAMABLE HTTP ENDPOINT</text>

      <rect x="22" y="40" width="664" height="38" rx="7" fill="#F4F4F5" stroke="#E4E4E7" stroke-width="1" />
      <text x="36" y="64" fill="#111113" font-family="'SF Mono', ui-monospace, monospace" font-size="13.5">https://mcp.yourdomain.com/mcp</text>

      <rect x="696" y="40" width="82" height="38" rx="7" fill="#111113" />
      <text x="737" y="64" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="600">Copy</text>

      <line x1="22" y1="94" x2="778" y2="94" stroke="#F4F4F5" stroke-width="1" />
      <text x="22" y="114" fill="#71717A" font-family="'SF Mono', ui-monospace, monospace" font-size="11.5">OAuth 2.1 Discovery: <tspan fill="#111113">/.well-known/oauth-authorization-server</tspan> · <tspan fill="#111113">/.well-known/oauth-protected-resource</tspan></text>
      <text x="22" y="130" fill="#71717A" font-family="'SF Mono', ui-monospace, monospace" font-size="11.5">SQLite WAL Engine: <tspan fill="#047857">Ready</tspan> · Uptime: 14d 6h · Transport: Stateless Streamable HTTP</text>
    </g>

    <!-- Card 2: Compact Connect Guide -->
    <g transform="translate(0, 278)">
      <rect x="0" y="0" width="256" height="94" rx="10" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1.2" />
      <text x="18" y="26" fill="#111113" font-size="13.5" font-weight="600">Web Gemini</text>
      <text x="18" y="48" fill="#52525B" font-size="12">Connected Apps &#8594; Custom MCP.</text>
      <text x="18" y="66" fill="#71717A" font-size="11.5">Paste /mcp URL; OAuth 2.1 DCR</text>
      <text x="18" y="82" fill="#71717A" font-size="11.5">&amp; PKCE run automatically.</text>

      <rect x="272" y="0" width="256" height="94" rx="10" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1.2" />
      <text x="290" y="26" fill="#111113" font-size="13.5" font-weight="600">Claude.ai &amp; ChatGPT</text>
      <text x="290" y="48" fill="#52525B" font-size="12">Custom Connectors &#8594; /mcp URL.</text>
      <text x="290" y="66" fill="#71717A" font-size="11.5">Stateless Streamable HTTP with</text>
      <text x="290" y="82" fill="#71717A" font-size="11.5">RFC 8707 resource binding.</text>

      <rect x="544" y="0" width="256" height="94" rx="10" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1.2" />
      <text x="562" y="26" fill="#111113" font-size="13.5" font-weight="600">Static OAuth &amp; SSO</text>
      <text x="562" y="48" fill="#52525B" font-size="12">Auth: /oauth/authorize</text>
      <text x="562" y="66" fill="#71717A" font-size="11.5">Token: /oauth/token</text>
      <text x="562" y="82" fill="#71717A" font-size="11.5">Password or Google/GitHub SSO.</text>
    </g>

    <!-- Card 3: Refined 10-Tool Surface Index -->
    <g transform="translate(0, 388)">
      <rect x="0" y="0" width="800" height="122" rx="10" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1.2" />
      <text x="22" y="26" fill="#71717A" font-family="'SF Mono', ui-monospace, monospace" font-size="11" font-weight="600" letter-spacing="0.6">10-TOOL CONTRACT SURFACE INDEX</text>

      <g transform="translate(22, 46)" font-family="'SF Mono', ui-monospace, monospace" font-size="12" fill="#111113">
        <circle cx="5" cy="-4" r="3" fill="#047857" /><text x="14" y="0">01 workspace_manage</text>
        <circle cx="195" cy="-4" r="3" fill="#047857" /><text x="204" y="0">02 code_explore</text>
        <circle cx="385" cy="-4" r="3" fill="#047857" /><text x="394" y="0">03 code_patch</text>
        <circle cx="575" cy="-4" r="3" fill="#047857" /><text x="584" y="0">04 workspace_exec</text>

        <circle cx="5" cy="22" r="3" fill="#047857" /><text x="14" y="26">05 dispatch_runner</text>
        <circle cx="195" cy="22" r="3" fill="#047857" /><text x="204" y="26">06 job_status</text>
        <circle cx="385" cy="22" r="3" fill="#047857" /><text x="394" y="26">07 github_inspect</text>
        <circle cx="575" cy="22" r="3" fill="#047857" /><text x="584" y="26">08 infra_inspect</text>

        <circle cx="5" cy="48" r="3" fill="#B45309" /><text x="14" y="52" fill="#B45309">09 stage_mutation_plan (Stage · 15m TTL)</text>
        <circle cx="385" cy="48" r="3" fill="#B91C1C" /><text x="394" y="52" fill="#B91C1C" font-weight="600">10 publish_changes (Single Approval Gate)</text>
      </g>
    </g>

    <!-- Quiet Footer -->
    <text x="0" y="534" fill="#71717A" font-size="12">Zero private workspace or credential data is exposed on this public endpoint.</text>
    <text x="800" y="534" text-anchor="end" fill="#111113" font-size="12" font-weight="600">Sign in to /admin &#8594;</text>
  </g>
</svg>
