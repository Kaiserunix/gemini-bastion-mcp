<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="GeminiBastionMCP Hero Banner">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1020" />
      <stop offset="55%" stop-color="#111a33" />
      <stop offset="100%" stop-color="#0b1020" />
    </linearGradient>
    <radialGradient id="blueGlow" cx="82%" cy="22%" r="55%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.26" />
      <stop offset="100%" stop-color="#0b1020" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="greenGlow" cx="15%" cy="80%" r="48%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#0b1020" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
