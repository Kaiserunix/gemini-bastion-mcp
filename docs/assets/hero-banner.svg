<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="GeminiBastionMCP v0.3.0 — Editorial Architecture Banner">
  <!-- Warm Alabaster Canvas & Subtle Swiss Grid -->
  <rect width="1280" height="360" rx="16" fill="#FBFBFB" />
  <g stroke="#EFEFEF" stroke-width="1">
    <line x1="0" y1="64" x2="1280" y2="64" />
    <line x1="0" y1="296" x2="1280" y2="296" />
    <line x1="96" y1="0" x2="96" y2="360" />
    <line x1="820" y1="0" x2="820" y2="360" />
    <line x1="1184" y1="0" x2="1184" y2="360" />
  </g>
  <rect x="1" y="1" width="1278" height="358" rx="15" fill="none" stroke="#E4E4E7" stroke-width="2" />

  <!-- Left Editorial Typography Column -->
  <g transform="translate(124, 78)" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', 'Segoe UI', system-ui, sans-serif">
    <!-- Quiet Eyebrow -->
    <g transform="translate(0, 0)">
      <circle cx="6" cy="11" r="4" fill="#047857" />
      <text x="18" y="15" fill="#52525B" font-family="'SF Mono', ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="12" font-weight="600" letter-spacing="0.4">v0.3.0 · OFFICIAL MCP REGISTRY · io.github.Kaiserunix/gemini-bastion-mcp</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="76" fill="#111113" font-size="52" font-weight="700" letter-spacing="-1.6">GeminiBastionMCP</text>

    <!-- Subtitle -->
    <text x="0" y="114" fill="#27272A" font-size="19" font-weight="500" letter-spacing="-0.2">Self-hosted OAuth 2.1 Streamable HTTP bastion for Web Gemini, Claude.ai, and ChatGPT.</text>
    <text x="0" y="142" fill="#71717A" font-size="15">10 tools, 1 approval gate · Cross-session SQLite memory · 4 agent drivers · bubblewrap workspace jail.</text>

    <!-- Minimal Hairline Capability Pills -->
    <g transform="translate(0, 174)" font-family="'SF Mono', ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="12" font-weight="500" fill="#27272A">
      <rect x="0" y="0" width="138" height="30" rx="6" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1.2" />
      <text x="69" y="19" text-anchor="middle">MCP 2025-11-25</text>

      <rect x="148" y="0" width="154" height="30" rx="6" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1.2" />
      <text x="225" y="19" text-anchor="middle">OAuth 2.1 + PKCE</text>

      <rect x="312" y="0" width="154" height="30" rx="6" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1.2" />
      <text x="389" y="19" text-anchor="middle">bwrap FS/Net Jail</text>

      <rect x="476" y="0" width="174" height="30" rx="6" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1.2" />
      <text x="563" y="19" text-anchor="middle">Persistent Memory</text>
    </g>
  </g>

  <!-- Right Minimalist Architecture Schematic Card -->
  <g transform="translate(848, 64)" font-family="'SF Mono', ui-monospace, 'JetBrains Mono', Menlo, monospace">
    <rect x="0" y="0" width="312" height="232" rx="12" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1.5" />
    <!-- Top card header -->
    <line x1="0" y1="38" x2="312" y2="38" stroke="#E4E4E7" stroke-width="1" />
    <rect x="18" y="13" width="12" height="12" rx="3" fill="#111113" />
    <text x="38" y="23" fill="#111113" font-size="11.5" font-weight="600">CONTRACT FUNNEL</text>
    <text x="294" y="23" text-anchor="end" fill="#71717A" font-size="11">10 TOOLS</text>

    <!-- Tier 1 Row -->
    <rect x="18" y="54" width="276" height="46" rx="8" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1" />
    <circle cx="34" cy="77" r="4" fill="#047857" />
    <text x="48" y="73" fill="#047857" font-size="11.5" font-weight="600">TIER 1 · TOOLS 01–08</text>
    <text x="48" y="89" fill="#065F46" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11.5">Sandbox &amp; Read-Only (Always Allow)</text>

    <!-- Tier 2 Row -->
    <rect x="18" y="110" width="276" height="46" rx="8" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1" />
    <circle cx="34" cy="133" r="4" fill="#B45309" />
    <text x="48" y="129" fill="#B45309" font-size="11.5" font-weight="600">TIER 2 · TOOL 09</text>
    <text x="48" y="145" fill="#92400E" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11.5">stage_mutation_plan (15m TTL Snapshot)</text>

    <!-- Tier 3 Row -->
    <rect x="18" y="166" width="276" height="48" rx="8" fill="#FEF2F2" stroke="#FECACA" stroke-width="1" />
    <circle cx="34" cy="190" r="4" fill="#B91C1C" />
    <text x="48" y="186" fill="#B91C1C" font-size="11.5" font-weight="600">TIER 3 · TOOL 10</text>
    <text x="48" y="202" fill="#991B1B" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11.5">publish_changes (Single Approval Gate)</text>
  </g>
</svg>
