<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="GeminiBastionMCP v0.3.0 Social Preview Card">
  <!-- Swiss Editorial Warm Alabaster Canvas & Grid -->
  <rect width="1280" height="640" fill="#FBFBFB" />
  <g stroke="#EFEFEF" stroke-width="1">
    <line x1="0" y1="88" x2="1280" y2="88" />
    <line x1="0" y1="552" x2="1280" y2="552" />
    <line x1="88" y1="0" x2="88" y2="640" />
    <line x1="1192" y1="0" x2="1192" y2="640" />
  </g>
  <rect x="28" y="28" width="1224" height="584" rx="20" fill="none" stroke="#E4E4E7" stroke-width="2" />

  <g transform="translate(88, 86)" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', 'Segoe UI', system-ui, sans-serif">
    <!-- Top Identity Row -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="60" height="60" rx="14" fill="#111113" />
      <path d="M30 12 L46 19 V32 C46 43 39 50 30 54 C21 50 14 43 14 32 V19 Z" fill="none" stroke="#FAFAFA" stroke-width="2.8" stroke-linejoin="round" />
      <circle cx="30" cy="31" r="4" fill="#FAFAFA" />

      <text x="80" y="26" fill="#52525B" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="14" font-weight="600">io.github.Kaiserunix/gemini-bastion-mcp · v0.3.0 · MIT</text>
      <text x="80" y="50" fill="#71717A" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="13.5">MCP 2025-11-25 STREAMABLE HTTP · OAUTH 2.1 + PKCE + DCR · GHCR :LITE &amp; :FULL</text>
    </g>

    <!-- Main Editorial Headline -->
    <text x="0" y="144" fill="#111113" font-size="64" font-weight="700" letter-spacing="-2.2">GeminiBastionMCP</text>
    <text x="0" y="194" fill="#27272A" font-size="25" font-weight="500" letter-spacing="-0.4">Self-hosted OAuth 2.1 MCP bastion for Web Gemini, Claude.ai, and ChatGPT.</text>
    <text x="0" y="232" fill="#71717A" font-size="18.5">10 tools, 1 approval gate · Cross-session SQLite workspace memory · 4 pluggable agent drivers · bwrap jail.</text>

    <!-- 3 Minimal Hairline Gallery Cards -->
    <g transform="translate(0, 278)">
      <!-- Card 1 -->
      <rect x="0" y="0" width="352" height="178" rx="12" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1.5" />
      <circle cx="26" cy="32" r="4.5" fill="#047857" />
      <text x="40" y="36" fill="#047857" font-family="'SF Mono', ui-monospace, monospace" font-size="12" font-weight="600" letter-spacing="0.5">10 TOOLS · 1 APPROVAL GATE</text>
      <text x="22" y="68" fill="#111113" font-size="18" font-weight="600">Zero-Popup Web AI Flow</text>
      <text x="22" y="96" fill="#52525B" font-size="14">Tools 01–08 run inside the sandbox.</text>
      <text x="22" y="118" fill="#52525B" font-size="14">Tool 09 stages 15m TTL plan snapshots.</text>
      <text x="22" y="140" fill="#52525B" font-size="14">Tool 10 (publish_changes) is the single</text>
      <text x="22" y="160" fill="#52525B" font-size="14">audited external write exit.</text>

      <!-- Card 2 -->
      <rect x="376" y="0" width="352" height="178" rx="12" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1.5" />
      <circle cx="402" cy="32" r="4.5" fill="#111113" />
      <text x="416" y="36" fill="#111113" font-family="'SF Mono', ui-monospace, monospace" font-size="12" font-weight="600" letter-spacing="0.5">PERSISTENT AGENT &amp; DRIVERS</text>
      <text x="398" y="68" fill="#111113" font-size="18" font-weight="600">Memory · Prompts · 4 CLIs</text>
      <text x="398" y="96" fill="#52525B" font-size="14">Cross-session SQLite workspace_memories,</text>
      <text x="398" y="118" fill="#52525B" font-size="14">4 MCP workflow Prompts, read-only CI</text>
      <text x="398" y="140" fill="#52525B" font-size="14">Watchdog, and Codex, Claude Code,</text>
      <text x="398" y="160" fill="#52525B" font-size="14">Gemini CLI &amp; OpenCode drivers.</text>

      <!-- Card 3 -->
      <rect x="752" y="0" width="352" height="178" rx="12" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1.5" />
      <circle cx="778" cy="32" r="4.5" fill="#B45309" />
      <text x="792" y="36" fill="#B45309" font-family="'SF Mono', ui-monospace, monospace" font-size="12" font-weight="600" letter-spacing="0.5">DEFENSE-IN-DEPTH SANDBOX</text>
      <text x="774" y="68" fill="#111113" font-size="18" font-weight="600">bwrap Jail &amp; Operator SSO</text>
      <text x="774" y="96" fill="#52525B" font-size="14">Per-workspace bubblewrap FS &amp; network</text>
      <text x="774" y="118" fill="#52525B" font-size="14">namespace jail (--unshare-net), UID</text>
      <text x="774" y="140" fill="#52525B" font-size="14">1001/1002 split, GIT_INDEX_FILE undo,</text>
      <text x="774" y="160" fill="#52525B" font-size="14">and fail-closed Google/GitHub SSO.</text>
    </g>
  </g>
</svg>
